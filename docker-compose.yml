services:
  frontend:
    build:
      context: ./frontend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      MONGODB_URI: mongodb://mongodb:27017/messaging
      REDIS_HOST: redis
      JWT_SECRET: development-only-secret-change-this-to-at-least-thirty-two-characters
    depends_on:
      - mongodb
      - redis
    restart: unless-stopped

  mongodb:
    image: mongo:8.2
    environment:
      MONGO_INITDB_DATABASE: messaging
    volumes:
      - mongodb-data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    volumes:
      - redis-data:/data
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
    depends_on:
      - frontend
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  mongodb-data:
  redis-data:
